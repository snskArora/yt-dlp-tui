name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.13.8"
  UV_PYTHON_PREFERENCE: only-system

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}

      - run: uv sync --frozen

      - name: Cache pinned tool downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/downloads
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/build.py') }}

      - name: Install pinned ffmpeg/deno for tests
        run: uv run --no-sync python scripts/build.py --tools-only build/test-tools >> "$GITHUB_PATH"

      - run: uv run --no-sync ruff check .

      - run: uv run --no-sync pytest

  build:
    name: Build (${{ matrix.platform }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows
            exe: dist/ytdl-tui/ytdl-tui.exe
            artifacts: dist/ytdl-tui-windows-x86_64.zip
          - os: ubuntu-22.04
            platform: linux
            exe: dist/ytdl-tui/ytdl-tui
            artifacts: |
              dist/ytdl-tui-linux-x86_64.tar.gz
              dist/ytdl-tui-linux-x86_64.AppImage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}

      - run: uv sync --frozen --no-dev --group build

      - name: Cache pinned tool downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/downloads
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/build.py') }}

      - name: Build bundle
        run: uv run --no-sync python scripts/build.py --platform ${{ matrix.platform }}

      - name: Smoke test (bundle)
        shell: bash
        run: ${{ matrix.exe }} --check

      - name: Smoke test (AppImage)
        if: matrix.platform == 'linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: dist/ytdl-tui-linux-x86_64.AppImage --check

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ytdl-tui-${{ matrix.platform }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts/
          merge-multiple: true

      - name: Generate changelog with git-cliff
        id: changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: v2.14.2
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.content }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            artifacts/ytdl-tui-windows-x86_64.zip
            artifacts/ytdl-tui-linux-x86_64.tar.gz
            artifacts/ytdl-tui-linux-x86_64.AppImage
